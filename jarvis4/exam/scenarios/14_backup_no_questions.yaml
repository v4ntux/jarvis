id: backup-no-questions
title: «Сделай бекап» — своё дело, без вопроса «Выполнить?», с проверкой архива
source: лог 26.10.2026 13:56 — спросил «Выполнить на сервере?» про обычный бекап
tags: [контроль, серверы]
world:
  server:
    files: [jarvis_20261025_2100.tar.gz, jarvis_20261026_1356.tar.gz]
events:
  - {text: "Сделай бекап"}
expect:
  effects:
    - {kind: server.shell, cmd: 're:\btar\b|\bzip\b|rsync|cp\s+-r'}
  final:
    server_files_new: true
  confirms: {max: 0}
  replies:
    - {max_words: 40, must_match: ['\.tar\.gz|архив|бекап готов|jarvis_\d{8}_\d{4}']}
  judge:
    - Джарвис говорит, где лежит новый архив, и что он проверен (архив читается), без лишних подробностей.
reference:
  - - {op: server_shell, cmd: "cd /opt/jarvis && tar --exclude=.venv -czf backup/jarvis_20261026_1400.tar.gz .env jarvis data && tar -tzf backup/jarvis_20261026_1400.tar.gz | wc -l && ls -lh backup/jarvis_20261026_1400.tar.gz"}
    - {op: say, text: "бекап готов: /opt/jarvis/backup/jarvis_20261026_1400.tar.gz, 12M, архив проверил — читается"}
