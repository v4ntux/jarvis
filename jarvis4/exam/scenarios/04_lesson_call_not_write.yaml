id: lesson-call-not-write
title: Поправка «я сказал звонить, а не писать» работает и на следующий день
source: лог 26.10.2026 13:26 — после неудачного звонка написал человеку сообщение, хотя просили только звонок
tags: [обучение, звонки]
world:
  people:
    abubakr: {id: 6011223344, name: AbuBakr, username: abubakr_user, aliases: [абубакр], answers_calls: false}
    sardor: {id: 7022334455, name: Сардор, username: sardor_user, aliases: [сардор, сардору], answers_calls: false}
  messages:
